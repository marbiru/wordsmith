// Renders a word that always fits on one line. Short words display at a normal
// large size; long words automatically shrink to fit the container width.
function FittedWord({ word }) {
  const charWidth = 0.58; // empirical ratio for Fraunces at weight 500
  const fontSize = 100;
  const estimatedWidth = word.length * charWidth * fontSize;
  // Define a "natural" viewBox width for short-to-medium words
  // (corresponds to ~12 character width — anything shorter renders at full size)
  const naturalWidth = 12 * charWidth * fontSize;
  // Use whichever is larger: the natural width or the word's actual width
  const viewBoxWidth = Math.max(naturalWidth, estimatedWidth * 1.04);
  const viewBoxHeight = fontSize * 1.2;

  return (
    <svg
      viewBox={`0 0 ${viewBoxWidth} ${viewBoxHeight}`}
      preserveAspectRatio="xMidYMid meet"
      className="w-full block"
      style={{ maxHeight: "5rem" }}
    >
      <text
        x="50%"
        y="55%"
        textAnchor="middle"
        dominantBaseline="middle"
        fontFamily="Fraunces, serif"
        fontWeight="500"
        fontSize={fontSize}
        fill="#1c1917"
      >
        {word}
      </text>
    </svg>
  );
}

function VocabTool() {
  const [history, setHistory] = useState([]); // {word, response, level, definition, example, pos}
  const [currentWord, setCurrentWord] = useState(null);
  const [showDefinition, setShowDefinition] = useState(false);
  const [lastResponse, setLastResponse] = useState(null);
  const [reviewMode, setReviewMode] = useState(false);
  const [reviewedAtNonKnowCount, setReviewedAtNonKnowCount] = useState(0); // # of non-"know" answers at last review
  const [lockedLevel, setLockedLevel] = useState(null); // null = auto-adapt; 1-5 = locked

  // Pure function to compute skill level from any history array.
  // Reused both for the display memo and for picking the next word.
  const computeSkillLevel = (h) => {
    if (h.length === 0) return 2;

    let level = 2;
    let highWaterMark = 2;

    for (let i = 0; i < h.length; i++) {
      const entry = h[i];
      const wordLevel = entry.level;

      if (entry.response === "know") {
        if (wordLevel >= level - 0.5) {
          const closeness = 1 - Math.max(0, level - wordLevel);
          level = Math.min(5, level + 0.4 * closeness + 0.15);
        }
      } else if (entry.response === "heard-known") {
        if (wordLevel >= level - 0.5) {
          level = Math.min(5, level + 0.2);
        }
      } else if (entry.response === "heard-surprised") {
        if (wordLevel >= level) {
          level = Math.max(highWaterMark, level - 0.15);
        }
      } else if (entry.response === "unknown") {
        if (wordLevel >= level) {
          level = Math.max(highWaterMark, level - 0.25);
        }
      }

      // Update high water mark: 2+ confirmed at floor(level) or above
      const confirmedAtOrAbove = h
        .slice(0, i + 1)
        .filter(
          (e) =>
            (e.response === "know" || e.response === "heard-known") &&
            e.level >= Math.floor(level)
        ).length;
      if (confirmedAtOrAbove >= 2 && Math.floor(level) > highWaterMark) {
        highWaterMark = Math.floor(level);
      }
    }

    return Math.max(1, Math.min(5, level));
  };

  // Compute current difficulty level for display
  const skillLevel = useMemo(() => computeSkillLevel(history), [history]);

  // Pick the next word. Pass in the most up-to-date history so we don't
  // accidentally pick a word that was just answered (state hasn't flushed yet).
  const pickNextWord = (historyOverride) => {
    const effectiveHistory = historyOverride ?? history;
    const seenWords = new Set(effectiveHistory.map((h) => h.word));
    let available = WORD_BANK.filter((w) => !seenWords.has(w.word));

    if (available.length === 0) {
      setCurrentWord(null);
      return;
    }

    // If user has locked a level, restrict to that level (with fallback if exhausted)
    if (lockedLevel !== null) {
      const atLevel = available.filter((w) => w.level === lockedLevel);
      if (atLevel.length > 0) {
        // Pick randomly from this level
        const chosen = atLevel[Math.floor(Math.random() * atLevel.length)];
        setCurrentWord(chosen);
        setShowDefinition(false);
        setLastResponse(null);
        return;
      }
      // Fall through to adaptive picker if no words left at locked level
    }

    // Compute target level from the up-to-date history
    const target = computeSkillLevel(effectiveHistory);

    // Score each word: distance from target, penalized harder for being EASIER
    // than target (asymmetric — we don't want to drop back to easy words).
    const scored = available.map((w) => {
      const distance = w.level - target;
      // Words below target get a stiffer penalty than words above
      const directionalPenalty = distance < 0 ? Math.abs(distance) * 1.8 : Math.abs(distance);
      return {
        word: w,
        score: directionalPenalty + Math.random() * 0.4,
      };
    });
    scored.sort((a, b) => a.score - b.score);

    // Pick from top 2 candidates randomly (smaller pool = stays near target)
    const topPick = scored.slice(0, Math.min(2, scored.length));
    const chosen = topPick[Math.floor(Math.random() * topPick.length)].word;

    setCurrentWord(chosen);
    setShowDefinition(false);
    setLastResponse(null);
  };

  // Initialize on first render
  useEffect(() => {
    if (!currentWord && history.length === 0) {
      pickNextWord([]);
    }
  }, []);

  const handleResponse = (response) => {
    if (!currentWord) return;
    // All three initial responses show the definition first.
    // The actual recorded outcome comes from the reaction buttons.
    setLastResponse(response);
    setShowDefinition(true);
  };

  // Called after the user reacts to seeing the definition.
  // outcome: 'confirmed' (matched expectation) or 'surprised' (didn't)
  const handleReaction = (outcome) => {
    if (!currentWord) return;

    // Map (initial response, outcome) → final recorded response for the algorithm
    let finalResponse;
    if (lastResponse === "know") {
      // Knew it: confirmed = real know; surprised = they were wrong, treat as heard-surprised
      finalResponse = outcome === "confirmed" ? "know" : "heard-surprised";
    } else if (lastResponse === "heard") {
      // Heard of it: confirmed = heard-known; surprised = heard-surprised
      finalResponse = outcome === "confirmed" ? "heard-known" : "heard-surprised";
    } else {
      // Didn't know: always counts as unknown regardless of reaction
      finalResponse = "unknown";
    }

    const entry = {
      word: currentWord.word,
      response: finalResponse,
      level: currentWord.level,
      definition: currentWord.definition,
      example: currentWord.example,
      pos: currentWord.pos,
    };
    const newHistory = [...history, entry];
    setHistory(newHistory);
    advanceOrReview(newHistory);
  };

  // Decide whether to enter review mode or pick the next word.
  // Review fires every 3 non-"know" answers (i.e. words user wasn't fully solid on).
  const advanceOrReview = (currentHistory) => {
    const nonKnowCount = currentHistory.filter((h) => h.response !== "know").length;
    if (nonKnowCount - reviewedAtNonKnowCount >= 3) {
      setReviewMode(true);
      setReviewedAtNonKnowCount(nonKnowCount);
      setCurrentWord(null);
      setShowDefinition(false);
      setLastResponse(null);
    } else {
      pickNextWord(currentHistory);
    }
  };

  const handleReviewDone = () => {
    setReviewMode(false);
    pickNextWord(history);
  };

  // Handle level lock change. If user picks a specific level, immediately
  // swap to a word at that level (unless mid-definition). Picking "Auto"
  // returns to adaptive behavior.
  const handleLockLevel = (level) => {
    setLockedLevel(level);
    // If user is currently between words (showing a word but hasn't seen def yet),
    // swap the current word to one matching the new locked level.
    if (currentWord && !showDefinition) {
      const seenWords = new Set(history.map((h) => h.word));
      let pool;
      if (level !== null) {
        pool = WORD_BANK.filter((w) => w.level === level && !seenWords.has(w.word));
      } else {
        pool = WORD_BANK.filter((w) => !seenWords.has(w.word));
      }
      if (pool.length > 0) {
        const chosen = pool[Math.floor(Math.random() * pool.length)];
        setCurrentWord(chosen);
      }
    }
  };

  const handleReset = () => {
    setHistory([]);
    setCurrentWord(null);
    setShowDefinition(false);
    setLastResponse(null);
    setReviewMode(false);
    setReviewedAtNonKnowCount(0);
    setTimeout(() => {
      // If a level is locked, start from that level; otherwise default to level 2
      const startLevel = lockedLevel ?? 2;
      const candidates = WORD_BANK.filter((w) => w.level === startLevel);
      const startWord = candidates[Math.floor(Math.random() * candidates.length)];
      setCurrentWord(startWord);
    }, 50);
  };

  const stats = useMemo(() => {
    const known = history.filter((h) => h.response === "know").length;
    const heard = history.filter(
      (h) => h.response === "heard-known" || h.response === "heard-surprised"
    ).length;
    const unknown = history.filter((h) => h.response === "unknown").length;
    return { known, heard, unknown, total: history.length };
  }, [history]);

  // Words to revisit during review mode — the last 3 non-"know" words
  const wordsForReview = useMemo(() => {
    return history
      .filter((h) => h.response !== "know")
      .slice(-3);
  }, [history, reviewMode]);

  const levelLabel = (lv) => {
    if (lv < 1.5) return "Approachable";
    if (lv < 2.5) return "Literary";
    if (lv < 3.5) return "Erudite";
    if (lv < 4.5) return "Recondite";
    return "Arcane";
  };

  const allDone = !currentWord && !reviewMode && history.length > 0 &&
    history.length >= WORD_BANK.length;

  return (
    <div className="min-h-screen w-full bg-stone-50 text-stone-900 font-serif">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500&display=swap');
        .font-display { font-family: 'Fraunces', serif; font-variation-settings: "opsz" 144; }
        .font-body { font-family: 'Cormorant Garamond', serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .paper-texture {
          background-color: #faf7f2;
          background-image:
            radial-gradient(circle at 20% 30%, rgba(120, 80, 40, 0.04) 0%, transparent 50%),
            radial-gradient(circle at 80% 70%, rgba(60, 40, 20, 0.03) 0%, transparent 50%);
        }
        .ink-line {
          background: linear-gradient(to right, transparent, #44403c 20%, #44403c 80%, transparent);
          height: 1px;
        }
        @keyframes fadeUp {
          from { opacity: 0; transform: translateY(8px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .fade-up { animation: fadeUp 0.5s ease-out; }
        @keyframes pulse-once {
          0%, 100% { transform: scale(1); }
          50% { transform: scale(1.03); }
        }
        .pulse-once { animation: pulse-once 0.4s ease-out; }
      `}</style>

      <div className="paper-texture min-h-screen">
        <div className="max-w-2xl mx-auto px-3 py-5 sm:px-6 sm:py-10">
          {/* Header */}
          <header className="mb-6 sm:mb-8 text-center">
            <div className="flex items-center justify-center gap-2 mb-2 text-stone-500">
              <BookOpen size={14} strokeWidth={1.5} />
              <span className="font-mono text-[10px] tracking-[0.3em] uppercase">
                Lexicon · Vol. I
              </span>
              <BookOpen size={14} strokeWidth={1.5} />
            </div>
            <h1 className="font-display text-4xl sm:text-5xl md:text-6xl font-medium tracking-tight text-stone-800">
              The <em className="italic font-light">Word</em>smith
            </h1>
            <div className="ink-line w-32 mx-auto mt-3 sm:mt-4" />
            <p className="font-body text-base sm:text-lg italic text-stone-600 mt-3 sm:mt-4 px-4 sm:px-0">
              A daily encounter with the language you didn't know you needed.
            </p>
          </header>

          {/* Level selector */}
          <div className="mb-4 sm:mb-6 flex flex-col items-center gap-2">
            <div className="font-mono text-[10px] tracking-[0.3em] uppercase text-stone-500">
              Difficulty
            </div>
            <div className="flex gap-1 flex-wrap justify-center">
              {[
                { value: null, label: "Auto" },
                { value: 1, label: "I" },
                { value: 2, label: "II" },
                { value: 3, label: "III" },
                { value: 4, label: "IV" },
                { value: 5, label: "V" },
              ].map(({ value, label }) => {
                const selected = lockedLevel === value;
                return (
                  <button
                    key={label}
                    onClick={() => handleLockLevel(value)}
                    className={`px-3 sm:px-4 py-1 sm:py-1.5 font-display text-sm tracking-wide transition-colors duration-150 border ${
                      selected
                        ? "bg-stone-900 text-stone-50 border-stone-900"
                        : "bg-white text-stone-700 border-stone-300 hover:bg-stone-100 hover:border-stone-500"
                    }`}
                    aria-pressed={selected}
                  >
                    {label}
                  </button>
                );
              })}
            </div>
            {lockedLevel !== null && (
              <div className="font-body italic text-xs text-stone-500 mt-1">
                Locked at level {lockedLevel} — {levelLabel(lockedLevel)}
              </div>
            )}
          </div>

          {/* Stats bar */}
          {history.length > 0 && (
            <div className="mb-4 sm:mb-8 flex items-center justify-between text-stone-600 font-mono text-[10px] tracking-widest uppercase border-y border-stone-300 py-2 sm:py-3">
              <div className="flex gap-4">
                <span><span className="text-stone-900 font-semibold">{stats.known}</span> known</span>
                <span><span className="text-stone-900 font-semibold">{stats.heard}</span> heard</span>
                <span><span className="text-stone-900 font-semibold">{stats.unknown}</span> new</span>
              </div>
              <div className="flex items-center gap-2">
                <TrendingUp size={11} strokeWidth={1.5} />
                <span>
                  {lockedLevel !== null
                    ? `${levelLabel(lockedLevel)} · Locked`
                    : levelLabel(skillLevel)}
                </span>
              </div>
            </div>
          )}

          {/* Main card */}
          {currentWord && !allDone && !reviewMode && (
            <div key={currentWord.word} className="fade-up">
              <div className="bg-white border border-stone-300 shadow-sm relative">
                {/* Decorative corner marks */}
                <div className="absolute top-2 left-2 w-3 h-3 border-t border-l border-stone-400" />
                <div className="absolute top-2 right-2 w-3 h-3 border-t border-r border-stone-400" />
                <div className="absolute bottom-2 left-2 w-3 h-3 border-b border-l border-stone-400" />
                <div className="absolute bottom-2 right-2 w-3 h-3 border-b border-r border-stone-400" />

                <div className="px-5 py-8 sm:px-8 sm:py-12 md:px-12 md:py-16">
                  <div className="text-center">
                    <div className="font-mono text-[10px] tracking-[0.3em] uppercase text-stone-500 mb-3 sm:mb-4">
                      № {history.length + 1} · Level {currentWord.level}
                    </div>
                    <FittedWord word={currentWord.word} />
                    <div className="font-body italic text-stone-500 mt-2 sm:mt-3 text-base sm:text-lg">
                      {currentWord.pos}
                    </div>
                  </div>

                  {/* Definition reveal */}
                  {showDefinition && (
                    <div className="fade-up mt-6 sm:mt-10 pt-5 sm:pt-8 border-t border-stone-200">
                      <p className="font-body text-lg sm:text-2xl leading-relaxed text-stone-800 text-center">
                        {currentWord.definition}
                      </p>
                      <div className="mt-4 sm:mt-6 px-4 sm:px-6 py-3 sm:py-4 bg-stone-100 border-l-2 border-stone-400">
                        <p className="font-body italic text-stone-700 text-base sm:text-lg">
                          "{currentWord.example}"
                        </p>
                      </div>
                    </div>
                  )}

                  {/* Initial response buttons — shown before definition */}
                  {!showDefinition && (
                    <div className="mt-6 sm:mt-12 space-y-2 sm:space-y-3">
                      <button
                        onClick={() => handleResponse("know")}
                        className="w-full py-3 sm:py-4 px-5 sm:px-6 bg-stone-900 text-stone-50 font-display text-base sm:text-lg font-medium tracking-wide hover:bg-stone-700 transition-colors duration-200 group"
                      >
                        <span className="block">I know it well</span>
                        <span className="hidden sm:block text-xs font-mono tracking-widest uppercase opacity-60 mt-1 group-hover:opacity-90">
                          And could use it in a sentence
                        </span>
                      </button>
                      <button
                        onClick={() => handleResponse("heard")}
                        className="w-full py-3 sm:py-4 px-5 sm:px-6 bg-white border border-stone-400 text-stone-800 font-display text-base sm:text-lg font-medium tracking-wide hover:bg-stone-100 transition-colors duration-200 group"
                      >
                        <span className="block">I've heard of it</span>
                        <span className="hidden sm:block text-xs font-mono tracking-widest uppercase opacity-60 mt-1 group-hover:opacity-90">
                          But I'm not sure of the precise meaning
                        </span>
                      </button>
                      <button
                        onClick={() => handleResponse("unknown")}
                        className="w-full py-3 sm:py-4 px-5 sm:px-6 bg-white border border-dashed border-stone-400 text-stone-700 font-display text-base sm:text-lg font-medium tracking-wide hover:bg-stone-100 transition-colors duration-200 group"
                      >
                        <span className="block italic">I don't know it</span>
                        <span className="hidden sm:block text-xs font-mono tracking-widest uppercase opacity-60 mt-1 group-hover:opacity-90 not-italic">
                          Teach me
                        </span>
                      </button>
                    </div>
                  )}

                  {/* After definition is shown */}
                  {showDefinition && (
                    <>
                      {/* Reaction buttons (skip for "unknown" — there's nothing to confirm) */}
                      {lastResponse !== "unknown" ? (
                        <div className="mt-5 sm:mt-8">
                          <div className="font-mono text-[10px] tracking-[0.3em] uppercase text-stone-400 mb-2 sm:mb-3 text-center">
                            Does that match what you thought?
                          </div>
                          <div className="grid grid-cols-2 gap-2 sm:gap-3">
                            <button
                              onClick={() => handleReaction("confirmed")}
                              className="py-3 sm:py-4 px-3 sm:px-5 bg-stone-900 text-stone-50 font-display text-sm sm:text-base font-medium tracking-wide hover:bg-stone-700 transition-colors duration-200 group"
                            >
                              <span className="block italic">"That's what I thought"</span>
                              <span className="hidden sm:block text-[10px] font-mono tracking-widest uppercase opacity-60 mt-1 group-hover:opacity-90 not-italic">
                                Onward
                              </span>
                            </button>
                            <button
                              onClick={() => handleReaction("surprised")}
                              className="py-3 sm:py-4 px-3 sm:px-5 bg-white border border-stone-400 text-stone-800 font-display text-sm sm:text-base font-medium tracking-wide hover:bg-stone-100 transition-colors duration-200 group"
                            >
                              <span className="block italic">"Oh, huh"</span>
                              <span className="hidden sm:block text-[10px] font-mono tracking-widest uppercase opacity-60 mt-1 group-hover:opacity-90 not-italic">
                                Good to know
                              </span>
                            </button>
                          </div>
                        </div>
                      ) : (
                        <div className="mt-5 sm:mt-8 flex justify-center">
                          <button
                            onClick={() => handleReaction("surprised")}
                            className="py-3 px-8 sm:px-10 bg-stone-900 text-stone-50 font-display text-base sm:text-lg font-medium tracking-wide hover:bg-stone-700 transition-colors duration-200 flex items-center gap-2"
                          >
                            <Sparkles size={16} strokeWidth={1.5} />
                            Next word
                          </button>
                        </div>
                      )}

                      <DancingCat />
                    </>
                  )}
                </div>
              </div>

              {/* Reset link */}
              {history.length > 0 && (
                <div className="mt-8 text-center">
                  <button
                    onClick={handleReset}
                    className="font-mono text-[10px] tracking-[0.3em] uppercase text-stone-500 hover:text-stone-800 transition-colors inline-flex items-center gap-2"
                  >
                    <RotateCcw size={11} strokeWidth={1.5} />
                    Begin anew
                  </button>
                </div>
              )}
            </div>
          )}

          {/* Review screen — appears every 5 words */}
          {reviewMode && (
            <div className="fade-up">
              <div className="bg-white border border-stone-300 shadow-sm relative">
                {/* Decorative corner marks */}
                <div className="absolute top-2 left-2 w-3 h-3 border-t border-l border-stone-400" />
                <div className="absolute top-2 right-2 w-3 h-3 border-t border-r border-stone-400" />
                <div className="absolute bottom-2 left-2 w-3 h-3 border-b border-l border-stone-400" />
                <div className="absolute bottom-2 right-2 w-3 h-3 border-b border-r border-stone-400" />

                <div className="px-8 py-10 md:px-12 md:py-12">
                  <div className="text-center mb-8">
                    <div className="inline-flex items-center gap-2 font-mono text-[10px] tracking-[0.3em] uppercase text-stone-500 mb-3">
                      <Repeat size={11} strokeWidth={1.5} />
                      Interlude · A brief review
                    </div>
                    <h2 className="font-display text-3xl md:text-4xl font-medium text-stone-900 italic">
                      Do you remember these?
                    </h2>
                    <div className="ink-line w-24 mx-auto mt-4" />
                  </div>

                  <div className="space-y-6">
                    {wordsForReview.map((entry, i) => (
                      <div
                        key={`${entry.word}-${i}`}
                        className="border-l-2 border-stone-300 pl-5 fade-up"
                        style={{ animationDelay: `${i * 80}ms` }}
                      >
                        <div className="flex items-baseline gap-3 flex-wrap">
                          <h3 className="font-display text-2xl text-stone-900 font-medium">
                            {entry.word}
                          </h3>
                          <span className="font-body italic text-stone-500 text-sm">
                            {entry.pos}
                          </span>
                        </div>
                        <p className="font-body text-lg text-stone-700 mt-1">
                          {entry.definition}
                        </p>
                        {entry.example && (
                          <p className="font-body italic text-stone-500 text-sm mt-1">
                            "{entry.example}"
                          </p>
                        )}
                      </div>
                    ))}
                  </div>

                  <div className="mt-10 flex justify-center">
                    <button
                      onClick={handleReviewDone}
                      className="py-3 px-10 bg-stone-900 text-stone-50 font-display text-lg font-medium tracking-wide hover:bg-stone-700 transition-colors duration-200 flex items-center gap-2"
                    >
                      <Sparkles size={16} strokeWidth={1.5} />
                      Continue
                    </button>
                  </div>
                </div>
              </div>

              {/* Reset link */}
              <div className="mt-8 text-center">
                <button
                  onClick={handleReset}
                  className="font-mono text-[10px] tracking-[0.3em] uppercase text-stone-500 hover:text-stone-800 transition-colors inline-flex items-center gap-2"
                >
                  <RotateCcw size={11} strokeWidth={1.5} />
                  Begin anew
                </button>
              </div>
            </div>
          )}

          {/* All done state */}
          {allDone && (
            <div className="bg-white border border-stone-300 px-8 py-16 text-center fade-up">
              <h2 className="font-display text-4xl text-stone-900 mb-4">
                <em className="italic">Finis.</em>
              </h2>
              <div className="ink-line w-24 mx-auto mb-6" />
              <p className="font-body text-xl text-stone-700 italic mb-2">
                You've encountered every word in this volume.
              </p>
              <p className="font-body text-lg text-stone-600">
                {stats.known} known · {stats.heard} heard · {stats.unknown} newly learned.
              </p>
              <button
                onClick={handleReset}
                className="mt-8 py-3 px-8 bg-stone-900 text-stone-50 font-display text-lg tracking-wide hover:bg-stone-700 transition-colors inline-flex items-center gap-2"
              >
                <RotateCcw size={16} strokeWidth={1.5} />
                Start over
              </button>
            </div>
          )}

          {/* Footer */}
          <footer className="mt-12 text-center font-mono text-[10px] tracking-[0.3em] uppercase text-stone-400">
            ❦ Difficulty adapts to your responses ❦
          </footer>
        </div>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<VocabTool />);

  </script>
</body>
</html>
